<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101116" />
    <title>수학 몬스터</title>
    <!-- 홈 화면 아이콘(아이패드 Safari 웹클립). 사이트 play/ 페이지로 서빙될 때 아이콘·제목 메타가 없어 Safari 가
         스크린샷으로 대충 만들었다(2026-09-12). 파일은 public/ 에 있고 tools/make_play_page_icons.py 가 만든다.
         상대 경로(./) — fadongkwon.com/play/<game>/ 아래 서빙되기 때문. Play·토스 래퍼(WebView)에는 무해. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="수학 몬스터" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script type="module" crossorigin src="./assets/index-DjUOuJwJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-yKxSMtnC.css">
  </head>
  <body>
    <div id="app">
      <button class="icon-btn" id="btn-sound" aria-label="소리 켜기/끄기">🔊</button>

      <section class="screen active" data-screen="home">
        <h1 class="title" id="title">👾 수학 몬스터</h1>
        <p class="dim" id="tagline">문제를 풀어 몬스터를 잡아라!<br />10마리 최단 시간 도전</p>
        <div class="mode-list" id="op-list"></div>
        <div class="home-links">
          <button class="btn secondary" id="btn-records">🏅 기록</button>
        </div>
        <div class="promo" id="promo"></div>
      </section>

      <section class="screen" data-screen="game">
        <div class="hud">
          <button class="hud-quit" id="btn-quit" aria-label="나가기">←</button>
          <span id="hud-time">0.0</span>
          <span id="hud-hearts"></span>
        </div>
        <div class="catchbar" id="catchbar"></div>
        <div class="monster" id="monster"></div>
        <div class="problem" id="problem"></div>
        <div class="answers" id="answers"></div>
      </section>

      <section class="screen" data-screen="records">
        <h2 id="records-title">🏅 기록 TOP 10</h2>
        <div class="picker" id="records-tabs"></div>
        <ol id="records-list" class="records"></ol>
        <p class="dim" id="records-empty" hidden>아직 기록이 없어요.<br />첫 도전으로 1위를 새겨보세요!</p>
        <button class="btn secondary" id="btn-records-back">돌아가기</button>
      </section>

      <section class="screen" data-screen="result">
        <h2 id="result-title"></h2>
        <div class="catchbar big-catch" id="result-monsters"></div>
        <div class="card">
          <div class="row"><span class="dim" id="label-time">걸린 시간</span><span class="big" id="clear-time"></span></div>
          <div class="row"><span class="dim" id="label-caught">잡은 몬스터</span><span id="clear-caught"></span></div>
          <div class="row" id="rank-row" hidden>
            <span class="record" id="rank-text"></span>
          </div>
        </div>
        <button class="btn" id="btn-retry">다시하기</button>
        <button class="btn secondary" id="btn-share">📤 자랑하기</button>
        <button class="btn secondary" id="btn-result-records">🏅 기록</button>
        <button class="btn secondary" id="btn-home">처음으로</button>
      </section>
    </div>
  </body>
</html>
