<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101116" />
    <title>영어 몬스터</title>
    <!-- 홈 화면 아이콘(아이패드 Safari 웹클립). 지금은 수학 몬스터 아이콘을 임시로 복사해 둔 것 — 정식 아이콘으로 교체 예정.
         상대 경로(./) — fadongkwon.com/play/<game>/ 아래 서빙되기 때문. Play·토스 래퍼(WebView)에는 무해. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="영어 몬스터" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script type="module" crossorigin src="./assets/index-BfhkitVP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Di2xklhD.css">
  </head>
  <body>
    <div id="app">
      <button class="icon-btn" id="btn-sound" aria-label="소리 켜기/끄기">🔊</button>

      <section class="screen active" data-screen="home">
        <div class="status-line" id="status-line"></div>
        <h1 class="title" id="title">🔤 영어 몬스터</h1>
        <p class="dim" id="tagline">단어를 맞혀 몬스터를 잡아라!</p>
        <div class="modes" id="level-tabs"></div>
        <div class="home-links">
          <button class="btn secondary review-btn" id="btn-review">👻 오답 몬스터</button>
          <button class="btn secondary" id="btn-dex">📖 도감</button>
        </div>
        <p class="dim small" id="review-note" hidden></p>
        <div class="day-grid" id="day-grid"></div>
        <div class="promo" id="promo"></div>
      </section>

      <section class="screen" data-screen="learn">
        <div class="learn-head">
          <button class="hud-quit" id="btn-learn-back" aria-label="돌아가기">←</button>
          <span class="learn-title" id="learn-title"></span>
          <span class="learn-prog" id="learn-prog"></span>
        </div>
        <div class="monster small-mon" id="learn-monster"></div>
        <div class="card word-card" id="word-card"></div>
        <button class="btn" id="btn-learn-next">다음</button>
        <button class="link-btn" id="btn-skip-hunt" hidden>바로 사냥하기</button>
      </section>

      <section class="screen" data-screen="unit">
        <div class="learn-head">
          <button class="hud-quit" id="btn-unit-back" aria-label="돌아가기">←</button>
          <span class="learn-title" id="unit-title"></span>
        </div>
        <div class="monster small-mon" id="unit-monster"></div>
        <p class="dim small" id="unit-sub"></p>
        <div class="quest" id="unit-steps"></div>
        <div class="quiet-box" id="unit-quiet"></div>
      </section>

      <section class="screen" data-screen="game">
        <div class="hud">
          <button class="hud-quit" id="btn-quit" aria-label="나가기">←</button>
          <span id="hud-time">0.0</span>
          <span id="hud-hearts"></span>
        </div>
        <div class="catchbar" id="catchbar"></div>
        <div class="monster" id="monster"></div>
        <div class="q-label dim" id="q-label"></div>
        <div class="prompt" id="prompt"></div>
        <div class="answers" id="answers"></div>
        <div class="spell" id="spell" hidden>
          <div class="slots" id="slots"></div>
          <div class="tiles" id="tiles"></div>
        </div>
        <div class="say" id="say" hidden>
          <div class="say-status" id="say-status"></div>
          <div class="say-btns">
            <button class="say-side" id="btn-say-listen" aria-label="듣기">🔊</button>
            <button class="mic-btn" id="btn-mic" aria-label="마이크">🎤</button>
            <button class="say-side say-skip" id="btn-say-skip">건너뛰기</button>
          </div>
        </div>
        <p class="dim small alt-note" id="alt-note" hidden></p>
        <button class="link-btn cant-btn" id="btn-cant" hidden></button>
      </section>

      <section class="screen" data-screen="result">
        <h2 id="result-title"></h2>
        <div class="catchbar big-catch" id="result-monsters"></div>
        <div class="card">
          <div class="row"><span class="dim" id="label-time">걸린 시간</span><span class="big" id="clear-time"></span></div>
          <div class="row"><span class="dim" id="label-caught">잡은 몬스터</span><span id="clear-caught"></span></div>
          <div class="row" id="stars-row"><span class="dim" id="label-stars">별점</span><span class="stars" id="clear-stars"></span></div>
          <div class="row" id="best-row"><span class="dim" id="label-best">최고 기록</span><span id="clear-best"></span></div>
          <div class="row" id="newbest-row" hidden><span class="record" id="newbest-text"></span></div>
        </div>
        <div class="word-list" id="escaped-box" hidden>
          <h3 id="escaped-title"></h3>
          <ul id="escaped-list"></ul>
          <p class="dim small" id="escaped-hint"></p>
        </div>
        <div class="word-list" id="grad-box" hidden>
          <h3 id="grad-title"></h3>
          <ul id="grad-list"></ul>
        </div>
        <p class="dim small" id="result-note" hidden></p>
        <button class="btn" id="btn-next-step" hidden></button>
        <button class="btn" id="btn-retry">다시하기</button>
        <div class="result-actions">
          <button class="btn secondary" id="btn-share">📤 자랑하기</button>
          <button class="btn secondary" id="btn-result-dex">📖 도감</button>
          <button class="btn secondary" id="btn-home">처음으로</button>
        </div>
      </section>

      <section class="screen" data-screen="dex">
        <h2 id="dex-title">📖 몬스터 도감</h2>
        <p class="dim" id="dex-count"></p>
        <div class="dex-grid" id="dex-grid"></div>
        <button class="btn secondary" id="btn-dex-back">돌아가기</button>
      </section>
    </div>
  </body>
</html>
