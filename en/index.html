<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <!-- 영문 홈이 /en/ 에서 루트(/)로 승격되면서 남긴 리다이렉트 스텁.
         /en/posts/... 같은 하위 경로는 그대로 유효하다. -->
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <meta http-equiv="refresh" content="0; url=/">
    <meta name="robots" content="noindex">
    <script>location.replace('/');</script>
  </head>
  <body>
    <a href="/">This page has moved to fadongkwon.com</a>
  </body>
</html>
