name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # 예약 게시용 정기 빌드: Jekyll은 미래 날짜 포스트를 빌드에서 제외하므로,
  # 날짜가 도래한 포스트를 공개하려면 push 없이도 빌드가 한 번 돌아야 한다.
  #
  # ⚠️ **GitHub 의 schedule 은 예정 시각에 안 돈다.** 실측(2026-09-05~12) 지연이
  #    매번 2시간 17분 ~ 4시간 55분이었다. 그래서 12:00 UTC(21:00 KST) 크론이
  #    실제로는 23:17~01:55 KST 에 돈다 — 사실상 자정 빌드다.
  #    그 결과 **09:00 KST 예약 글은 그날 빌드를 못 타고 다음 날 자정까지 404** 였다
  #    (2026-09-12 minesweeper 가 10:43 까지 404. 전날 2048 은 빌드 실패에 가려 못 봤다).
  #    9/12~9/20 게임 글 9편이 전부 09:00 예약이라 같은 일이 반복될 상황이었다.
  #
  # 그래서 아침 크론을 하나 더 둔다. 01:00 UTC = 10:00 KST 예정 → 지연을 얹어도
  # 10:00~15:00 KST 사이에 돌므로 **09:00 글보다 항상 뒤**다(이게 핵심 — 크론을
  # 09:00 KST 에 맞추면 지연이 짧은 날 글보다 먼저 돌아 또 하루를 넘긴다).
  #   01:00 UTC → 09:00 KST 예약분을 그날 오전~오후에 공개
  #   12:00 UTC → 20:00 KST 예약분을 그날 밤에 공개
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 12 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          set -o pipefail
          # 실패 사유를 annotation 으로도 올린다 — 로그 본문은 인증이 필요해서
          # 실패 원인을 밖에서 확인할 수 없었고(주석에는 exit code 만 남는다),
          # 그 때문에 원인을 추측으로 좁히다 빌드를 두 번 더 태웠다(2026-09-10).
          if ! bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/" \
            2>&1 | tee htmlproofer.log; then
            grep -E "linking to|does not exist|internal|failure" htmlproofer.log \
              | head -n 30 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
