<!-- 한국어 태그 구름.
  jekyll-theme-chirpy v7.6.0 의 _layouts/tags.html 오버라이드다.
  Gemfile 이 버전을 고정하고 있으니, 테마를 올릴 때 원본과 다시 대조할 것.
  원본 대비 변경점: 링크 접두어 `/tags/` -> `/ko/tags/` 한 곳뿐.

  왜 필요한가 — URL 규칙(2026-09-11: 영어 = /*, 한국어 = /ko/*)에 따라
  jekyll-archives 가 한국어 태그를 `/ko/tags/:name/` 로 만드는데, 테마 원본은
  접두어를 하드코딩해 `/tags/<한글>/` 로 링크한다. 그 주소는 영문 태그 스텁의
  공간이라 존재하지 않고, **htmlproofer 가 283건으로 빌드를 죽인다**
  (2026-09-11 실제로 이걸로 실패했다). 영문판은 _layouts/en-tags.html 이 담당한다.
-->
---
layout: page
# All the Tags of posts.
---

<div id="tags" class="d-flex flex-wrap mx-xl-2">
  {% assign tags = '' | split: '' %}
  {% for t in site.tags %}
    {% assign tags = tags | push: t[0] %}
  {% endfor %}

  {% assign sorted_tags = tags | sort_natural %}

  {% for t in sorted_tags %}
    <div>
      <a class="tag" href="{{ t | slugify | url_encode | prepend: '/ko/tags/' | append: '/' | relative_url }}">
        {{ t -}}
        <span class="text-muted">{{ site.tags[t].size }}</span>
      </a>
    </div>
  {% endfor %}
</div>
